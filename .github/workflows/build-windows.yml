name: Build & Release Windows

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本 bump（相对 package.json 的 version）'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        if: inputs.bump != 'none'
        shell: pwsh
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Read version + build tag
        id: ver
        shell: pwsh
        run: |
          $v  = (Get-Content package.json | ConvertFrom-Json).version
          $ts = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss')
          $tag = "v$v-$ts"
          "VERSION=$v"        >> $env:GITHUB_OUTPUT
          "TAG=$tag"          >> $env:GITHUB_OUTPUT
          "RELEASE_NAME=$tag" >> $env:GITHUB_OUTPUT

      - name: Build (skip electron-builder 自动 publish)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse -File dist/ | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Create & push tag
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.ver.outputs.TAG }}
          git push origin ${{ steps.ver.outputs.TAG }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: ${{ steps.ver.outputs.RELEASE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.zip
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}